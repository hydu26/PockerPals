<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#07050f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0e8ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="card-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#a78bfa" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle glow -->
  <ellipse cx="256" cy="256" rx="180" ry="160" fill="rgba(167,139,250,0.08)"/>

  <!-- Playing card -->
  <rect x="136" y="72" width="240" height="368" rx="24"
        fill="url(#card)"
        stroke="url(#accent)" stroke-width="3"
        filter="url(#card-shadow)"/>

  <!-- Top-left J -->
  <text x="162" y="148"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="900" font-size="72"
        fill="url(#accent)">J</text>

  <!-- Top-left spade (small) -->
  <text x="162" y="198"
        font-family="serif" font-size="44"
        fill="url(#accent)">♠</text>

  <!-- Center spade -->
  <text x="256" y="334"
        font-family="serif" font-size="160"
        text-anchor="middle"
        fill="url(#accent)">♠</text>

  <!-- Bottom-right J (rotated 180°) -->
  <text x="350" y="432"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="900" font-size="72"
        fill="url(#accent)"
        text-anchor="end"
        transform="rotate(180 308 400)">J</text>
</svg>
